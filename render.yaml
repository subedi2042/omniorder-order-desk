services:
  - type: web
    name: desi-kitchen-order-desk
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
